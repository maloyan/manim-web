<!doctype html>
<html lang="en">
  <head>
    <script>
      if (new URLSearchParams(location.search).has('embed'))
        document.documentElement.classList.add('embed');
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ManimWeb - 3D Cell</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1a1a2e;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: system-ui, sans-serif;
      }
      .controls {
        margin-top: 12px;
        display: flex;
        gap: 10px;
      }
      button {
        padding: 8px 18px;
        border: none;
        border-radius: 6px;
        background: #58c4dd;
        color: #111;
        font-size: 15px;
        cursor: pointer;
      }
      button:disabled {
        background: #666;
        cursor: not-allowed;
      }
      html.embed .controls {
        display: none !important;
      }
      #container {
        border: 2px solid #333;
        border-radius: 8px;
        overflow: hidden;
      }
      html.embed,
      html.embed body {
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden;
        background: #000 !important;
        width: 100%;
        height: 100%;
      }
      html.embed #container {
        border: none !important;
        border-radius: 0 !important;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div id="container"></div>
    <div class="controls">
      <button id="playBtn">Build the cell</button>
    </div>
    <script type="module" src="./cell_3d.ts"></script>
  </body>
</html>
