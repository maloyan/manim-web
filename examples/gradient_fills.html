<!doctype html>
<html lang="en">
  <head>
    <script>
      if (new URLSearchParams(location.search).has('embed'))
        document.documentElement.classList.add('embed');
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ManimWeb - Gradient Fills</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1a1a2e;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: system-ui, sans-serif;
      }
      #container {
        border: 2px solid #333;
        border-radius: 8px;
        overflow: hidden;
      }
      .controls {
        margin-top: 20px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
      }
      button {
        padding: 10px 16px;
        background: #e94560;
        border: none;
        border-radius: 4px;
        color: white;
        cursor: pointer;
        font-size: 14px;
      }
      button:hover {
        background: #ff6b6b;
      }
      html.embed,
      html.embed body {
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden;
        background: #000 !important;
        width: 100%;
        height: 100%;
      }
      html.embed .controls {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="container"></div>
    <div class="controls">
      <button id="rotate">Rotate linear angle</button>
      <button id="palette">Swap palette</button>
      <button id="flat">Toggle flat fill</button>
    </div>

    <script type="module" src="./gradient_fills.ts"></script>
  </body>
</html>
