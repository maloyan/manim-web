<!doctype html>
<html lang="en">
  <head>
    <script>
      if (new URLSearchParams(location.search).has('embed'))
        document.documentElement.classList.add('embed');
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ManimWeb - Toon Shading</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1a1a2e;
        gap: 16px;
        padding: 16px 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: system-ui, sans-serif;
      }
      .scene {
        border: 2px solid #333;
        border-radius: 8px;
        overflow: hidden;
      }
      .label {
        color: #ccc;
        font-size: 14px;
      }
      .controls {
        margin-top: 20px;
        display: flex;
        gap: 10px;
      }
      button {
        padding: 10px 20px;
        background: #e94560;
        border: none;
        border-radius: 4px;
        color: white;
        cursor: pointer;
        font-size: 14px;
      }
      button:hover {
        background: #ff6b6b;
      }
      button:disabled {
        background: #666;
        cursor: not-allowed;
      }
      html.embed,
      html.embed body {
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden;
        background: #000 !important;
        width: 100%;
        height: 100%;
      }
      html.embed body {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      html.embed .controls {
        display: none !important;
      }
      html.embed .label,
      html.embed #cartoon {
        display: none !important;
      }
      html.embed #manim {
        border: none !important;
        border-radius: 0 !important;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="label">Manim preset (default): setToonShading()</div>
    <div id="manim" class="scene"></div>
    <div class="controls">
      <button id="buildBtn">Replay build-up</button>
    </div>
    <div class="label">Cartoon preset: setToonShading('cartoon')</div>
    <div id="cartoon" class="scene"></div>

    <script type="module" src="./toon_shading.ts"></script>
  </body>
</html>
