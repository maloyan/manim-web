<!doctype html>
<html lang="en">
  <head>
    <script>
      if (new URLSearchParams(location.search).has('embed'))
        document.documentElement.classList.add('embed');
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ManimWeb - Explainer Direction</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1a1a2e;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: system-ui, sans-serif;
        gap: 12px;
        padding: 16px;
        color: #eee;
      }
      h1 {
        font-size: 18px;
        font-weight: 500;
      }
      #container {
        border: 2px solid #333;
        border-radius: 8px;
        overflow: hidden;
      }
      p {
        font-size: 13px;
        color: #aaa;
        max-width: 640px;
        text-align: center;
      }
      html.embed,
      html.embed body {
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden;
        background: #000 !important;
        width: 100%;
        height: 100%;
      }
      html.embed body {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      html.embed h1,
      html.embed p {
        display: none !important;
      }
      html.embed #container {
        border: none !important;
        border-radius: 0 !important;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <h1>Explainer Direction: Camera Tour with Captions</h1>
    <div id="container"></div>
    <p>
      A narrated tour in manim style. The camera flies from object to object with
      <code>focusOn</code>, a <code>CaptionCard</code> names each stop, a
      <code>Callout3D</code> follows a point on the torus, an <code>InsetPanel</code> shows a
      close-up, and <code>FocusDim</code> washes the objects out of focus.
    </p>

    <script type="module" src="./explainer_direction.ts"></script>
  </body>
</html>
