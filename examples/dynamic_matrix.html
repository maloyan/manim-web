<!doctype html>
<html lang="en">
  <head>
    <script>
      if (new URLSearchParams(location.search).has('embed'))
        document.documentElement.classList.add('embed');
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ManimWeb - Dynamic Matrix</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1a1a2e;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: system-ui, sans-serif;
        color: #eee;
      }
      h1 {
        font-size: 18px;
        margin-bottom: 14px;
        font-weight: 600;
      }
      p {
        font-size: 13px;
        margin-bottom: 14px;
        color: #aaa;
      }
      #container {
        border: 2px solid #333;
        border-radius: 8px;
        overflow: hidden;
      }
      html.embed,
      html.embed body {
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden;
        background: #000 !important;
        width: 100%;
        height: 100%;
      }
      html.embed body {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      html.embed h1,
      html.embed p {
        display: none !important;
      }
      html.embed #container {
        border: none !important;
        border-radius: 0 !important;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <h1>Dynamic Matrix: drag the basis vectors</h1>
    <p>
      Drag the green (i) and red (j) vector tips. The grid and the yellow point morph live under the
      2x2 matrix.
    </p>
    <div id="container"></div>

    <script type="module" src="./dynamic_matrix.ts"></script>
  </body>
</html>
